<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatClub Online</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:white;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    background:white;
}

#chatBox{
    position:fixed;
    left:10px;
    bottom:10px;
    display:flex;
    gap:5px;
    z-index:10;
}

#chatInput{
    width:220px;
    height:40px;
    border-radius:10px;
    border:2px solid black;
    padding-left:10px;
    font-size:16px;
}

#sendBtn{
    height:45px;
    border:none;
    border-radius:10px;
    background:#2196f3;
    color:white;
    padding:0 15px;
    font-size:16px;
    cursor:pointer;
}

#namePopup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:20;
}

#popupContent{
    width:320px;
    background:white;
    padding:20px;
    border-radius:20px;
    text-align:center;
}

#nameInput{
    width:90%;
    height:40px;
    font-size:16px;
    border-radius:10px;
    border:2px solid black;
    padding-left:10px;
}

#colorInput{
    width:100%;
    height:50px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#startBtn{
    width:100%;
    height:45px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#2196f3;
    color:white;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="namePopup">
    <div id="popupContent">

        <h1>ChatClub</h1>

        <p>Digite seu nome</p>

        <input
            id="nameInput"
            maxlength="15"
            placeholder="Seu nome"
        >

        <input
            type="color"
            id="colorInput"
            value="#0000ff"
        >

        <button id="startBtn">
            Entrar
        </button>

    </div>
</div>

<canvas id="game"></canvas>

<div id="chatBox">
    <input id="chatInput" placeholder="Mensagem...">
    <button id="sendBtn">Enviar</button>
</div>

<script>
// =====================================
// SUPABASE
// =====================================

const SUPABASE_URL =
"https://hlkainqwjptgflzqsfuf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rciw1jgA4brYyLJqknIqEQ_1WU_saEf";

const sb =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// =====================================
// CANVAS
// =====================================

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

function resize(){

    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();

addEventListener("resize", resize);

// =====================================
// PLAYER
// =====================================

let playerName = "Player";

const player = {

    id: crypto.randomUUID(),

    x:300,
    y:300,

    targetX:300,
    targetY:300,

    size:60,

    speed:4,

    color:"#0000ff",

    selected:false,

    moving:false,

    bubbleText:"",
    bubbleTimer:0,

    canTalk:true,

    walkFrame:0
};

let onlinePlayers = {};

// =====================================
// START
// =====================================

document
.getElementById("startBtn")
.onclick = async ()=>{

    const nameInput =
    document.getElementById("nameInput");

    const colorInput =
    document.getElementById("colorInput");

    if(nameInput.value.trim() !== ""){
        playerName =
        nameInput.value.trim();
    }

    player.color =
    colorInput.value;

    document
    .getElementById("namePopup")
    .style.display = "none";

    await syncPlayer();

    // atualiza database
    setInterval(syncPlayer, 120);

    // pega players online
    setInterval(loadPlayers, 120);
};

// =====================================
// CLICK
// =====================================

canvas.addEventListener(
"click",
(e)=>{

    const rect =
    canvas.getBoundingClientRect();

    const mouseX =
    e.clientX - rect.left;

    const mouseY =
    e.clientY - rect.top;

    // selecionar player
    if(
        mouseX >= player.x &&
        mouseX <= player.x + player.size &&
        mouseY >= player.y &&
        mouseY <= player.y + player.size
    ){

        player.selected = true;

        return;
    }

    // mover
    if(player.selected){

        player.targetX =
        mouseX - player.size/2;

        player.targetY =
        mouseY - player.size/2;

        player.selected = false;

        player.moving = true;
    }
});

// =====================================
// CHAT
// =====================================

document
.getElementById("sendBtn")
.onclick = sendMessage;

document
.getElementById("chatInput")
.addEventListener(
"keydown",
(e)=>{

    if(e.key === "Enter"){
        sendMessage();
    }
});

async function sendMessage(){

    // anti spam
    if(!player.canTalk){
        return;
    }

    const input =
    document.getElementById(
        "chatInput"
    );

    if(input.value.trim() === ""){
        return;
    }

    player.bubbleText =
    input.value;

    player.bubbleTimer = 300;

    player.canTalk = false;

    await syncPlayer();

    input.value = "";
}

// =====================================
// DATABASE
// =====================================

async function syncPlayer(){

    await sb
    .from("players")
    .upsert({

        id: player.id,

        name: playerName,

        color: player.color,

        x: player.x,
        y: player.y,

        message: player.bubbleText,

        last_seen: Date.now()
    });
}

async function loadPlayers(){

    const now = Date.now();

    const { data, error } =
    await sb
    .from("players")
    .select("*");

    if(error){
        console.log(error);
        return;
    }

    onlinePlayers = {};

    data.forEach((p)=>{

        // remove fantasmas
        if(now - p.last_seen < 5000){

            onlinePlayers[p.id] = p;
        }
    });
}

// =====================================
// UPDATE
// =====================================

function update(){

    const dx =
    player.targetX - player.x;

    const dy =
    player.targetY - player.y;

    const distance =
    Math.sqrt(dx*dx + dy*dy);

    // andar
    if(distance > 1){

        player.x +=
        (dx / distance)
        * player.speed;

        player.y +=
        (dy / distance)
        * player.speed;

        player.walkFrame += 0.2;

        player.moving = true;

    }else{

        player.moving = false;
    }

    // timer bubble
    if(player.bubbleTimer > 0){

        player.bubbleTimer--;

        if(player.bubbleTimer <= 0){

            player.bubbleText = "";

            player.canTalk = true;

            syncPlayer();
        }
    }
}

// =====================================
// DRAW PLAYER
// =====================================

function drawPlayer(
p,
isLocal=false
){

    const size = 60;

    let offsetY = 0;

    // animação andando
    if(isLocal && player.moving){

        offsetY =
        Math.sin(player.walkFrame)
        * 4;
    }

    // nome
    ctx.fillStyle = "black";

    ctx.font = "20px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        p.name,
        p.x + size/2,
        p.y - 20
    );

    // cubo
    ctx.fillStyle = p.color;

    ctx.fillRect(
        p.x,
        p.y + offsetY,
        size,
        size
    );

    // seleção
    if(isLocal && player.selected){

        ctx.strokeStyle = "black";

        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.arc(
            player.x + size/2,
            player.y + size/2,
            size,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }

    // bubble
    if(
        p.message &&
        p.message !== ""
    ){

        ctx.font = "18px Arial";

        const textWidth =
        ctx.measureText(
            p.message
        ).width + 30;

        const bubbleX =
        p.x + size/2
        - textWidth/2;

        const bubbleY =
        p.y - 80;

        ctx.fillStyle = "white";

        ctx.strokeStyle = "black";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.roundRect(
            bubbleX,
            bubbleY,
            textWidth,
            40,
            10
        );

        ctx.fill();

        ctx.stroke();

        ctx.fillStyle = "black";

        ctx.fillText(
            p.message,
            p.x + size/2,
            p.y - 53
        );
    }
}

// =====================================
// DRAW
// =====================================

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for(const id in onlinePlayers){

        const p =
        onlinePlayers[id];

        drawPlayer(
            p,
            id === player.id
        );
    }
}

// =====================================
// LOOP
// =====================================

function loop(){

    update();

    draw();

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
